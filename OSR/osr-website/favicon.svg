<svg xmlns="http://www.w3.org/2000/svg" viewBox="-51.043 -221.543 1126.087 1126.087" width="1126.087" height="1126.087" role="img" aria-label="Office of the Student Regent">
  <!-- The OSR mark from osr-logo-original.png, traced to one vector path so the tab
       keeps the real logo at every size instead of a downscaled raster of it.
       Generated by tools/make-tab-icons.mjs — see that file to rebuild the PNG,
       ICO and apple-touch-icon set from this path.

       The square around the mark belongs to that script as well: it writes this
       viewBox and these dimensions from the same frame the rasters are drawn
       in. A tab is square and this mark is not, so the two axes have to be
       centred on the mark separately — the frame this file used to carry took
       the padding its width needed and applied that to the height too, which
       pushed the mark up against the top edge of the tab. Do not hand-edit the
       viewBox; edit the framing in the script and run `npm run icons`. -->
  <title>Office of the Student Regent — Bulacan State University</title>
  <style>
    /* The tab the icon lands on decides the colour: institutional red on light
       browser chrome, a light tint of the same red on dark chrome so the mark
       never becomes a dark blob on a dark strip. One file, both scenes — see
       tools/make-tab-icons.mjs for the raster fallbacks that browsers without
       an SVG favicon (Safari, iOS, legacy) read instead. */
    .mark { fill: #A6192E; }
    @media (prefers-color-scheme: dark) { .mark { fill: #FFC9D3; } }
  </style>
