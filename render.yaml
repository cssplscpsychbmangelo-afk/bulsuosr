# Render Blueprint for the Express + SQLite OSR CMS.
# Keep the repository root as the service root: the backend serves files from
# both OSR/admin and OSR/osr-website at runtime.
services:
  - type: web
    name: bulsu-osr-cms
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    buildCommand: npm ci --prefix OSR/server
    startCommand: cd OSR/server && npm start
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    disk:
      name: osr-cms-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/osr.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@osr.bulsu.edu.ph
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
