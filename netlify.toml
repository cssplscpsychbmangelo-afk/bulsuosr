# ── Netlify configuration (root) ──
# Public site lives in OSR/osr-website, so that is what we publish.
# Base directory empty (repo root).

[build]
  base    = "."
  publish = "OSR/osr-website"
  command = "npm ci --prefix OSR/server && node OSR/osr-website/netlify-build.mjs"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "OSR/server/netlify"
  node_bundler = "esbuild"
  included_files = ["OSR/osr-website/index.html"]

# Minimal headers — avoid complex CSP that can fail validation.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
